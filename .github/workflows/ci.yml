name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning --std=c11 \
            --error-exitcode=1 --inline-suppr -q \
            --suppress=normalCheckLevelMaxBranches \
            -I src -I src/lib -I src/core -I src/fuzz -I src/backends -I src/engine \
            src/

  build-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            werror: true
          - os: ubuntu-latest
            cc: clang
            werror: false   # clang + project's -Wpedantic trips a C2y-extension
                             # warning inside glib's own headers (__COUNTER__ use
                             # in gstring.h) — not our code; portability signal
                             # only until that's addressed deliberately.
          - os: macos-latest
            cc: clang
            werror: false   # same reasoning; also unverified end-to-end (no
                             # macOS runner available to test this locally).
    env:
      CC: ${{ matrix.cc }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libyaml-dev \
            libsubunit-dev \
            check \
            ccache
          # Meson strips a literal "ccache" prefix from CC (confirmed locally:
          # both `CC="ccache gcc"` and a native-file `c = ['ccache', 'gcc']`
          # get silently dropped from the ninja rule). The supported way in is
          # to let `cc`/`gcc`/`clang` resolve through ccache's own symlinks.
          echo "/usr/lib/ccache/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config glib libyaml check ccache meson ninja
          echo "$(brew --prefix)/opt/ccache/libexec" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ matrix.cc }}-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'meson.build', 'meson.options') }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.cc }}-

      - name: Cache pip
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.os }}

      - name: Install meson + ninja (Linux)
        if: runner.os == 'Linux'
        run: python3 -m pip install --upgrade meson ninja

      - name: Configure
        run: meson setup build ${{ matrix.werror && '-Dwerror=true' || '' }}

      - name: Build
        run: ninja -C build

      - name: Run test suite
        run: meson test -C build --print-errorlogs

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meson-testlog-${{ matrix.os }}-${{ matrix.cc }}
          path: build/meson-logs/testlog.txt
          retention-days: 7

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libyaml-dev \
            libsubunit-dev \
            check \
            ccache
          echo "/usr/lib/ccache/bin" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitize-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'meson.build', 'meson.options') }}
          restore-keys: |
            ccache-sanitize-

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu-latest

      - name: Install meson + ninja
        run: python3 -m pip install --upgrade meson ninja

      - name: Configure (ASan + UBSan)
        run: meson setup build -Db_sanitize=address,undefined

      - name: Build
        run: ninja -C build

      - name: Run test suite under sanitizers
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: meson test -C build --print-errorlogs

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meson-testlog-sanitize
          path: build/meson-logs/testlog.txt
          retention-days: 7

  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libyaml-dev \
            libsubunit-dev \
            check \
            gcovr

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu-latest

      - name: Install meson + ninja
        run: python3 -m pip install --upgrade meson ninja

      - name: Configure (coverage build)
        run: meson setup build -Denable_coverage=true -Dwerror=true

      - name: Build
        run: ninja -C build

      - name: Run test suite
        run: meson test -C build --print-errorlogs

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meson-testlog-coverage
          path: build/meson-logs/testlog.txt
          retention-days: 7

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          gcovr -r . build \
            --exclude 'tests/.*' \
            --xml-pretty --output coverage/coverage.xml \
            --html-details --output coverage/index.html \
            --print-summary | tee coverage/summary.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Coverage summary"
            echo
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
