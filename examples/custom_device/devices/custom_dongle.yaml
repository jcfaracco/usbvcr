device_descriptor:
  - bLength: 18
    bDescriptorType: 0x01
    bcdUSB: 0x0200
    bDeviceClass: 0xff          # Vendor Specific Class
    bDeviceSubClass: 0x00
    bDeviceProtocol: 0x00
    bMaxPacketSize0: 64
    idVendor: 0x1234
    idProduct: 0x5678
    bcdDevice: 0x0100
    iManufacturer: 1
    iProduct: 2
    iSerialNumber: 3
    bNumConfigurations: 1

configurations:
  - bLength: 9
    bDescriptorType: 0x02
    wTotalLength: 32          # 9 (config) + 9 (iface) + 7 (ep in) + 7 (ep out)
    bNumInterfaces: 1
    bConfigurationValue: 1
    iConfiguration: 0
    bmAttributes: 0x80        # Bus powered
    bMaxPower: 50             # 100 mA
    interfaces:
      - bLength: 9
        bDescriptorType: 0x04
        bInterfaceNumber: 0
        bAlternateSetting: 0
        bNumEndpoints: 2
        bInterfaceClass: 0xff      # Vendor Specific
        bInterfaceSubClass: 0x00
        bInterfaceProtocol: 0x00
        iInterface: 0
        endpoints:
          - bLength: 7
            bDescriptorType: 0x05
            bEndpointAddress: 0x81  # Bulk IN
            bmAttributes: 0x02       # Bulk transfer
            wMaxPacketSize: 64
            bInterval: 0
          - bLength: 7
            bDescriptorType: 0x05
            bEndpointAddress: 0x01  # Bulk OUT
            bmAttributes: 0x02       # Bulk transfer
            wMaxPacketSize: 64
            bInterval: 0
