states:
  - name: "operational"
    rules:
      # Standard GET_DESCRIPTOR (device)
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0100
        actions:
          - respond_with: "$device.device_descriptor"

      # Standard GET_DESCRIPTOR (configuration)
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0200
        actions:
          - respond_with: "$device.configurations[0]"

      # Standard GET_DESCRIPTOR (string 0 - language IDs)
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0300
        actions:
          - respond_with:
              hex: "04030904" # LangID 0x0409 (English US)

      # Standard GET_DESCRIPTOR (string 1 - Manufacturer)
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0301
        actions:
          - respond_with:
              hex: "1803530061006E004400690073006B00200043006F00720070002E00" # "SanDisk Corp."

      # Standard GET_DESCRIPTOR (string 2 - Product)
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0302
        actions:
          - respond_with:
              hex: "2c035600690072007400750061006C002000550053004200200044007200690076006500" # "Virtual USB Drive"

      # Standard GET_DESCRIPTOR (string 3 - SerialNumber)
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0303
        actions:
          - respond_with:
              hex: "22033000310032003300340035003600370038003900410042004300440045004600" # "0123456789ABCDEF"

      # MSC Bulk-Only Transport (BOT) Class Request: GET_MAX_LUN (0xfe)
      # Returns 1 byte indicating the maximum LUN index (0 = 1 LUN supported)
      - match:
          bmRequestType: 0xa1
          bRequest: 0xfe
        actions:
          - respond_with:
              hex: "00"

      # MSC Bulk-Only Transport (BOT) Class Request: BOT Reset (0xff)
      - match:
          bmRequestType: 0x21
          bRequest: 0xff
        actions:
          - respond_with_status: 0

      # Standard Request: SET_CONFIGURATION
      # Acknowledge configuration selection
      - match:
          bmRequestType: 0x00
          bRequest: 9
          wValue: 1
        actions:
          - respond_with_status: 0

      # SCSI INQUIRY (Opcode 0x12) on Bulk OUT 0x02
      # Returns 36 bytes standard SCSI INQUIRY response + 13-byte CSW on Bulk IN 0x81
      - match:
          endpoint_out: 0x02
        actions:
          - queue_endpoint_data:
              endpoint: 0x81
              payloads:
                # 36-byte SCSI INQUIRY data:
                # Peripheral Device Type = 0x00 (Direct Access Block Device / Disk)
                # Removable = 0x80 (RMB=1)
                # Vendor: "SanDisk ", Product: "Cruzer Blade    ", Rev: "1.00"
                - hex: "008002021f00000053616e4469736b204372757a657220426c61646520202020312e3030"
                # 13-byte CSW ("USBS", tag auto-matched from CBW, residue=0, status=0)
                - hex: "55534253000000000000000000"

                # 8-byte SCSI READ CAPACITY (10) data (1 GB drive: 2097152 sectors of 512 bytes):
                # Last Logical Block Address = 0x001FFFFF (2097151)
                # Block Length in bytes = 0x00000200 (512)
                - hex: "001fffff00000200"
                # CSW for READ CAPACITY
                - hex: "55534253000000000000000000"

                # 4-byte SCSI MODE SENSE (6) data:
                # Mode data length = 0x03, Medium type = 0x00, Device-specific = 0x00 (not write-protected), Block desc = 0x00
                - hex: "03000000"
                # CSW for MODE SENSE
                - hex: "55534253000000000000000000"

                # CSW for TEST UNIT READY (Ready)
                - hex: "55534253000000000000000000"
