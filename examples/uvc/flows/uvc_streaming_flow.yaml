version: "1.0"
name: "uvc_streaming_flow"

states:
  - name: "idle"
    rules:
      # Standard GET_DESCRIPTOR
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0100
        actions:
          - respond_with: "$device.device_descriptor"

      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0200
        actions:
          - respond_with: "$device.configurations[0]"

      # Standard SET_CONFIGURATION(1)
      - match:
          bmRequestType: 0x00
          bRequest: 9
          wValue: 1
        actions:
          - respond_with_status: 0

      # UVC VS PROBE_CONTROL (cs=0x01) GET_CUR / GET_MIN / GET_MAX / GET_DEF
      - match:
          bmRequestType: 0xA1
          bRequest: 0x81
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0x81
          bRequest: 0x81
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0xA1
          bRequest: 0x82
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0xA1
          bRequest: 0x83
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0xA1
          bRequest: 0x87
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"

      # UVC VS COMMIT_CONTROL (cs=0x02) GET_CUR
      - match:
          bmRequestType: 0xA1
          bRequest: 0x81
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0x81
          bRequest: 0x81
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"

      # UVC PROBE_CONTROL and COMMIT_CONTROL SET_CUR
      - match:
          bmRequestType: 0x21
          bRequest: 0x01
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x01
          bRequest: 0x01
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x21
          bRequest: 0x01
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x01
          bRequest: 0x01
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with_status: 0

      # SU4 selector unit controls
      - match:
          bmRequestType: 0xA1
          bRequest: 0x81
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with: "$device.selector_input_response"
      - match:
          bmRequestType: 0x81
          bRequest: 0x81
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with: "$device.selector_input_response"
      - match:
          bmRequestType: 0x21
          bRequest: 0x01
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x01
          bRequest: 0x01
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with_status: 0

      # Host requests alternate setting 1 to activate video streaming bandwidth -> transition to streaming
      - match:
          bmRequestType: 0x01
          bRequest: 0x0B
          wValue: 0x0001
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
          - transition_state: "streaming"

      # Control status interrupt polling (EP 0x81)
      - match:
          endpoint_poll: 0x81
        actions:
          - return_nak_if_queue_empty: true

      # Isochronous polling while idle (EP 0x82) -> NAK (zero bandwidth)
      - match:
          endpoint_poll: 0x82
        actions:
          - return_nak_if_queue_empty: true

  # State Inheritance: 'streaming' inherits all standard descriptors, probe/commit
  # controls, and interrupt polling from 'idle', overriding only EP 0x82 streaming
  # and handling SET_INTERFACE alt=0 to return to idle.
  - name: "streaming"
    extends: "idle"
    rules:
      # Host requests alternate setting 0 to stop video streaming -> transition to idle
      - match:
          bmRequestType: 0x01
          bRequest: 0x0B
          wValue: 0x0000
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
          - transition_state: "idle"

      # Isochronous video streaming polling (EP 0x82) -> stream frames from file
      - match:
          endpoint_poll: 0x82
        actions:
          - stream_from_file:
              file: "payloads/stream.mjpeg"
              loop: true
