version: "1.0"
name: "uvc_streaming_flow"

states:
  - name: "operational"
    rules:
      # Standard GET_DESCRIPTOR
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0100
        actions:
          - respond_with: "$device.device_descriptor"

      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0200
        actions:
          - respond_with: "$device.configurations[0]"

      # Standard SET_CONFIGURATION(1)
      - match:
          bmRequestType: 0x00
          bRequest: 9
          wValue: 1
        actions:
          - respond_with_status: 0

      # UVC VS PROBE_CONTROL (cs=0x01) GET_CUR / GET_MIN / GET_MAX / GET_DEF
      # Handled for class interface request types (0xA1 and 0x81)
      - match:
          bmRequestType: 0xA1
          bRequest: 0x81  # UVC_GET_CUR
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0x81
          bRequest: 0x81
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0xA1
          bRequest: 0x82  # UVC_GET_MIN
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0xA1
          bRequest: 0x83  # UVC_GET_MAX
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0xA1
          bRequest: 0x87  # UVC_GET_DEF
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"

      # UVC VS COMMIT_CONTROL (cs=0x02) GET_CUR
      - match:
          bmRequestType: 0xA1
          bRequest: 0x81
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"
      - match:
          bmRequestType: 0x81
          bRequest: 0x81
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with: "$device.probe_commit_response"

      # UVC PROBE_CONTROL and COMMIT_CONTROL SET_CUR
      - match:
          bmRequestType: 0x21
          bRequest: 0x01  # UVC_SET_CUR
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x01
          bRequest: 0x01
          wValue: 0x0100
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x21
          bRequest: 0x01
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x01
          bRequest: 0x01
          wValue: 0x0200
          wIndex: 0x0001
        actions:
          - respond_with_status: 0

      # SU4 selector unit controls
      - match:
          bmRequestType: 0xA1
          bRequest: 0x81
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with: "$device.selector_input_response"
      - match:
          bmRequestType: 0x81
          bRequest: 0x81
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with: "$device.selector_input_response"
      - match:
          bmRequestType: 0x21
          bRequest: 0x01
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with_status: 0
      - match:
          bmRequestType: 0x01
          bRequest: 0x01
          wValue: 0x0100
          wIndex: 0x0004
        actions:
          - respond_with_status: 0

      # Host requests alternate setting 1 to activate video streaming bandwidth
      - match:
          bmRequestType: 0x01
          bRequest: 0x0B
          wValue: 0x0001
          wIndex: 0x0001
        actions:
          - respond_with_status: 0

      # Host requests alternate setting 0 to stop video streaming
      - match:
          bmRequestType: 0x01
          bRequest: 0x0B
          wValue: 0x0000
          wIndex: 0x0001
        actions:
          - respond_with_status: 0

      # Control status interrupt polling (EP 0x81)
      - match:
          endpoint_poll: 0x81
        actions:
          - return_nak_if_queue_empty: true

      # Isochronous video streaming polling (EP 0x82)
      - match:
          endpoint_poll: 0x82
        actions:
          - stream_from_file:
              file: "payloads/stream.mjpeg"
              loop: true
