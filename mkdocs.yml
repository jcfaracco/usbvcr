site_name: usbvcr
site_description: YAML in, real USB traffic out.
repo_url: https://github.com/jcfaracco/usbvcr
repo_name: jcfaracco/usbvcr
docs_dir: docs

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - YAML Dialect: yaml_dialect.md
  - Running Engines: running_engines.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
