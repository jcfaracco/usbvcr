device_descriptor:
  - bLength: 18
    bDescriptorType: 0x01
    bcdUSB: 0x0200
    bDeviceClass: 0x00
    bDeviceSubClass: 0x00
    bDeviceProtocol: 0x00
    bMaxPacketSize0: 8
    idVendor: 0x04d9
    idProduct: 0x1702
    bcdDevice: 0x0406
    iManufacturer: 1
    iProduct: 2
    iSerialNumber: 0
    bNumConfigurations: 1

configurations:
  - bConfigurationValue: 1
    bmAttributes: 0xa0
    bMaxPower: 50
    interfaces:
      - bInterfaceNumber: 0
        bInterfaceClass: 0x03 # HID
        bInterfaceSubClass: 0x01 # Boot
        bInterfaceProtocol: 0x01 # Keyboard
        hid_descriptor:
          wDescriptorLength: 63
        endpoints:
          - address: 0x81
            attributes: 0x03 # Interrupt
            max_packet_size: 8
            interval: 10
        report_descriptor:
          codec: "hid_report"
          items:
            - usage_page: "Generic Desktop"
            - usage: "Keyboard"
            - collection: "Application"
            - usage_page: "Key Codes"
            - usage_minimum: 0xe0
            - usage_maximum: 0xe7
            - logical_minimum: 0
            - logical_maximum: 1
            - report_size: 1
            - report_count: 8
            - input: "Data,Var,Abs"
            - report_count: 1
            - report_size: 8
            - input: "Const,Array,Abs"
            - end_collection: true
