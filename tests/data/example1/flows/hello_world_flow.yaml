states:
  - name: "enumeration"
    rules:
      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0100
        actions:
          - respond_with: "$device.device_descriptor"

      - match:
          bmRequestType: 0x80
          bRequest: 6
          wValue: 0x0200
        actions:
          - respond_with: "$device.configurations[0]"

      - match:
          bmRequestType: 0x81
          bRequest: 6
          wValue: 0x2200
          wIndex: 0
        actions:
          - respond_with: "$device.report_descriptor"

      # When the host activates the device configuration, start typing
      - match:
          bmRequestType: 0x00 # Host to Device, Standard, Device
          bRequest: 9         # SET_CONFIGURATION
          wValue: 1
        actions:
          - respond_with_status: 0 # ACK the setup packet
          - transition_state: "type_hello_world"

  - name: "type_hello_world"
    on_enter:
      # Queue 8-byte HID reports to the Interrupt IN endpoint buffer.
      # The host will pull these one by one based on the endpoint's polling interval.
      - queue_endpoint_data:
          endpoint: 0x81
          payloads:
            - hex: "02000B0000000000" # Shift + H (0x0B)
            - hex: "0000000000000000" # Release all
            - hex: "0000080000000000" # e (0x08)
            - hex: "0000000000000000" # Release
            - hex: "00000F0000000000" # l (0x0F)
            - hex: "0000000000000000" # Release (Crucial between identical consecutive keys)
            - hex: "00000F0000000000" # l (0x0F)
            - hex: "0000000000000000" # Release
            - hex: "0000120000000000" # o (0x12)
            - hex: "0000000000000000" # Release
            - hex: "00002C0000000000" # Space (0x2C)
            - hex: "0000000000000000" # Release
            - hex: "00001A0000000000" # w (0x1A)
            - hex: "0000000000000000" # Release
            - hex: "0000120000000000" # o (0x12)
            - hex: "0000000000000000" # Release
            - hex: "0000150000000000" # r (0x15)
            - hex: "0000000000000000" # Release
            - hex: "00000F0000000000" # l (0x0F)
            - hex: "0000000000000000" # Release
            - hex: "0000070000000000" # d (0x07)
            - hex: "0000000000000000" # Release
    rules:
      # While in this state, handle empty polling requests gracefully
      - match:
          endpoint_poll: 0x81
        actions:
          - return_nak_if_queue_empty: true
