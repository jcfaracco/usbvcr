# Same device as example1/devices/keyboard_hello_world.yaml, but every
# descriptor mapping's fields are deliberately written out of USB wire
# order. Proves usb_node_canonicalize_order() (src/lib/usb_node.c) fixes
# serialization regardless of YAML key order: test_yaml_backend.c asserts
# this produces the exact same bytes as the correctly-ordered original.
device_descriptor:
  - idProduct: 0x1702
    idVendor: 0x04d9
    bNumConfigurations: 1
    iSerialNumber: 0
    iProduct: 2
    iManufacturer: 1
    bcdDevice: 0x0406
    bMaxPacketSize0: 8
    bDeviceProtocol: 0x00
    bDeviceSubClass: 0x00
    bDeviceClass: 0x00
    bcdUSB: 0x0200
    bDescriptorType: 0x01
    bLength: 18

configurations:
  - bMaxPower: 50
    bmAttributes: 0xa0
    iConfiguration: 0
    bConfigurationValue: 1
    bNumInterfaces: 1
    wTotalLength: 34
    bDescriptorType: 0x02
    bLength: 9
    interfaces:
      - iInterface: 0
        bInterfaceProtocol: 0x01
        # hid_descriptor stays before endpoints, same relative position as
        # the original: nested sub-descriptor sequencing is a structural
        # choice (file order), not part of the fixed interface header that
        # usb_node_canonicalize_order() reorders.
        hid_descriptor:
          wDescriptorLength: 45
          bReportDescriptorType: 0x22
          bNumDescriptors: 1
          bCountryCode: 0
          bcdHID: 0x0111
          bDescriptorType: 0x21
          bLength: 9
        bInterfaceSubClass: 0x01
        bInterfaceClass: 0x03
        bNumEndpoints: 1
        bAlternateSetting: 0
        bInterfaceNumber: 0
        bDescriptorType: 0x04
        bLength: 9
        endpoints:
          - bInterval: 10
            wMaxPacketSize: 8
            bmAttributes: 0x03
            bEndpointAddress: 0x81
            bDescriptorType: 0x05
            bLength: 7

report_descriptor:
  codec: "hid_report"
  items:
    - usage_page: "Generic Desktop"
    - usage: "Keyboard"
    - collection: "Application"
    - usage_page: "Key Codes"
    - usage_minimum: 0xe0
    - usage_maximum: 0xe7
    - logical_minimum: 0
    - logical_maximum: 1
    - report_size: 1
    - report_count: 8
    - input: "Data,Var,Abs"
    - report_count: 1
    - report_size: 8
    - input: "Const,Array,Abs"
    - report_count: 6
    - report_size: 8
    - logical_minimum: 0
    - logical_maximum: 101
    - usage_page: "Key Codes"
    - usage_minimum: 0
    - usage_maximum: 101
    - input: "Data,Array,Abs"
    - end_collection: true
