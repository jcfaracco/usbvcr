device_descriptor:
  schema: "usb_base.device_descriptor"
  idVendor: 0x04d9
  idProduct: 0x1702
  bcdDevice: 0x0406
  iManufacturer: 1
  iProduct: 2

configurations:
  - schema: "usb_base.configuration_descriptor"
    bmAttributes: 0xa0
    interfaces:
      - schema: "hid_base.interface_descriptor"
        bInterfaceNumber: 0
        bInterfaceSubClass: 0x01
        bInterfaceProtocol: 0x01
        hid_descriptor:
          wDescriptorLength: 62
        endpoints:
          - address: 0x81
            attributes: 0x03
            max_packet_size: 8
            interval: 10
        report_descriptor:
          codec: "hid_report"
          items:
            - usage_page: "Generic Desktop"
            - usage: "Keyboard"
            - collection: "Application"
            - usage_page: "Key Codes"
            - usage_minimum: 0xe0
            - usage_maximum: 0xe7
            - logical_minimum: 0
            - logical_maximum: 1
            - report_size: 1
            - report_count: 8
            - input: "Data,Var,Abs"
            - report_count: 1
            - report_size: 8
            - input: "Const,Array,Abs"
            - end_collection: true

      - schema: "hid_base.interface_descriptor"
        bInterfaceNumber: 1
        bInterfaceSubClass: 0x00
        bInterfaceProtocol: 0x00
        hid_descriptor:
          wDescriptorLength: 101
        endpoints:
          - address: 0x82
            attributes: 0x03
            max_packet_size: 8
            interval: 10
        report_descriptor:
          raw_file: "payloads/hid_consumer_report.bin"
